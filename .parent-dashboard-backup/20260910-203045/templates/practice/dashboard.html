{% extends "base.html" %}
{% load account %}
{% load static %}
{% block title %}Dashboard — RevisorPlus{% endblock %}

{% block extra_head %}
{# This page's stylesheet was 925 lines of inline <style> in this block. #}
<link rel="stylesheet" href="{% static 'student_portals/dashboard.css' %}?v=10">
{% endblock %}

{% comment %}
Full-bleed: .kid-dash paints the page's grey canvas, so it runs edge to edge and
.kid-dash__shell inside it measures the content off base.html's --measure and
--gutter. Taking <main>'s own measure as well would inset the canvas and double
the gutter.
{% endcomment %}
{% block main_class %}rp-bleed py-4{% endblock %}

{% block main %}
<div class="kid-dash">
  {% user_display user as pupil_name %}
  <div class="kid-dash__shell">

    {% comment %}
      One header above the tabs, in base.html's shared .rp-page-head. There
      were two before, one per tab: .kid-dash__hello here (hidden while the
      student tab was up) and .kid-dash__head inside the student view, which
      put this page's h1 below the tab bar while every other page's sat
      directly under the nav. The exam chip stays where it was, in the
      header's right-hand slot.
    {% endcomment %}
    <div class="rp-page-head">
      <div class="rp-page-head__text">
        <span class="rp-page-head__kicker">Dashboard</span>
        <h1 class="rp-page-head__title">Welcome back, {{ pupil_name }}</h1>
        <p class="rp-page-head__lead">
          {% if coverage %}
            {{ coverage.seen }} of {{ coverage.bank }} questions attempted.
          {% endif %}
          Ready to make a little more progress today?
        </p>
      </div>
      {% if readiness.goal %}
      <div class="rp-page-head__aside">
        <div class="kid-dash__examchip">
          <div class="kid-dash__examchip-strong">{{ readiness.goal.target_label }}</div>
          <div>{{ readiness.goal.exam_date|date:"D j M" }}</div>
          <div>{{ readiness.goal.days_remaining }} day{{ readiness.goal.days_remaining|pluralize }} to go</div>
        </div>
      </div>
      {% else %}
      <div class="rp-page-head__aside">
        <div class="kid-dash__examchip">
          <div class="kid-dash__examchip-strong">No target set</div>
          <div><a href="{% url 'goals:setup' %}">Set one</a></div>
        </div>
      </div>
      {% endif %}
    </div>

    <div class="kid-dash__tabs" role="tablist" aria-label="Dashboard view">
      <button type="button" class="kid-dash__tab is-active" id="student-tab" role="tab" aria-selected="true" aria-controls="student-view" data-dashboard-tab="student">
        {{ pupil_name }}’s practice
      </button>
      <button type="button" class="kid-dash__tab" id="parent-tab" role="tab" aria-selected="false" aria-controls="parent-view" data-dashboard-tab="parent">
        Parent summary
      </button>
    </div>

    <div class="kid-dash__view" id="student-view" role="tabpanel" aria-labelledby="student-tab" data-dashboard-view="student">

      {% comment %}
        Structure follows docs/dashboard-redesign.html element for element:
        Subjects panel, Resume panel, then Today and Mock papers side by side
        in .cols. The head it opened with — h1, subline and exam chip — is now
        the shared page header above the tabs.
      {% endcomment %}
      <div class="kid-dash__panel">
        <div class="kid-dash__panelhead">
          <h2>Subjects</h2>
          <a class="kid-dash__hint" href="{% url 'practice:choose' %}">Go to Study &rsaquo;</a>
        </div>
        <p class="kid-dash__panelsub">Accuracy over the last 30 days.</p>

        {% comment %}
          Coloured from band_level, never from the band label: the wording is
          still open (the parent side says Secure / Developing / Needs work) and
          changing a string should not change which row is coloured. The row's
          subject tint is a second modifier off the same s.key the chip and the
          bar fill use, so a subject is one colour across all three.
        {% endcomment %}
        {% for s in subjects %}
        <a class="kid-dash__srow kid-dash__srow--{{ s.key }}" href="{% url 'practice:subject_detail' s.code %}">
          <span class="kid-dash__chip kid-dash__chip--{{ s.key }}" aria-hidden="true">{{ s.chip }}</span>
          <span class="kid-dash__sname">{{ s.name }}</span>
          <span class="kid-dash__track" role="progressbar"
                aria-valuenow="{{ s.pct_complete }}" aria-valuemin="0" aria-valuemax="100"
                aria-label="{{ s.name }}: {{ s.completed }} of {{ s.total }} questions attempted">
            <span class="kid-dash__fill kid-dash__fill--{{ s.key }}" style="width: {{ s.pct_complete }}%;"></span>
          </span>
          <span class="kid-dash__count">{{ s.completed }} of {{ s.total }} attempted</span>
          {% if s.band_level == "good" %}
            <span class="kid-dash__verdict kid-dash__verdict--good">{{ s.band }}</span>
          {% elif s.band_level == "mid" %}
            <span class="kid-dash__verdict kid-dash__verdict--mid">{{ s.band }}</span>
          {% elif s.band_level == "low" %}
            <span class="kid-dash__verdict kid-dash__verdict--low">{{ s.band }}</span>
          {% else %}
            <span class="kid-dash__verdict kid-dash__verdict--none">Not enough yet</span>
          {% endif %}
          <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
        </a>
        {% endfor %}
      </div>

      {% if resume %}
      <div class="kid-dash__panel kid-dash__panel--resume">
        <div class="kid-dash__resumeline">
          <div>
            <div class="kid-dash__resume-t">{{ resume.name }}</div>
            <div class="kid-dash__resume-m">
              {{ resume.section }}{% if resume.total %}, {{ resume.done }} of {{ resume.total }} answered{% endif %}
            </div>
          </div>
          <a class="kid-dash__btn" href="{% url 'practice:resume' resume.id %}">Resume</a>
        </div>
      </div>
      {% endif %}

      <div class="kid-dash__cols">
        <div class="kid-dash__panel kid-dash__panel--plain">
          <h2>Today</h2>
          <p class="kid-dash__panelsub">Start at the top. You don’t have to do all of it.</p>

          {% if pending_assignments or suggested_topics %}
          {% now "Y-m-d" as today %}
          {% for a in pending_assignments|slice:":3" %}
          <a class="kid-dash__trow" href="{% url 'practice:start' a.subtopic.id %}">
            <span class="kid-dash__trow-main">
              <span class="kid-dash__tname">
                {{ a.subtopic.name }}
                {% if a.due_date|date:"Y-m-d" < today %}<span class="kid-dash__late">Late</span>{% endif %}
              </span>
              <span class="kid-dash__tmeta">Set by your tutor, {{ a.target_count }} question{{ a.target_count|pluralize }}</span>
            </span>
            <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
          </a>
          {% endfor %}
          {% for topic in suggested_topics|slice:":3" %}
          <a class="kid-dash__trow" href="{% url 'practice:start' topic.id %}">
            <span class="kid-dash__trow-main">
              <span class="kid-dash__tname">{{ topic.name }}</span>
              <span class="kid-dash__tmeta">Worth some practice</span>
            </span>
            <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
          </a>
          {% endfor %}
          {% else %}
          <p class="kid-dash__empty">
            Nothing set for today.
            <a href="{% url 'practice:choose' %}">Pick a subject</a> and this list will fill in as you practise.
          </p>
          {% endif %}
        </div>

        <div class="kid-dash__panel kid-dash__panel--plain">
          <h2>Mock papers</h2>
          <p class="kid-dash__panelsub">Sat under timed conditions, one paper at a sitting.</p>
          {% for p in mock_papers %}
          <a class="kid-dash__trow" href="{% url 'practice:mock_choose' %}">
            <span class="kid-dash__trow-main">
              <span class="kid-dash__tname">{{ p.section.name }}</span>
              <span class="kid-dash__tmeta">
                {% if p.sat_on %}Sat {{ p.sat_on|date:"j M" }}{% else %}Not sat yet{% endif %}
              </span>
            </span>
            <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
          </a>
          {% endfor %}
        </div>
      </div>

    </div>

    <div class="kid-dash__view" id="parent-view" role="tabpanel" aria-labelledby="parent-tab" data-dashboard-view="parent" hidden>
      <div class="kid-parent">

        <section class="kid-parent__hero">
          <div class="kid-parent__hero-copy">
            <span class="kid-parent__eyebrow">Parent summary</span>
            <h2>{{ parent_greeting }}{% if parent_name %}, {{ parent_name }}{% endif %}</h2>
            <p>Here’s how {{ pupil_name }} is progressing.</p>
          </div>

          <div class="kid-parent__readiness">
            <div class="kid-parent__readiness-topline">
              <span>Overall readiness</span>
              {% if readiness.goal %}
                <strong>{{ readiness.readiness_pct }}%</strong>
              {% else %}
                <strong>{{ overall_accuracy }}%</strong>
              {% endif %}
            </div>
            <div class="kid-parent__readiness-track" role="progressbar"
                 aria-valuenow="{% if readiness.goal %}{{ readiness.readiness_pct }}{% else %}{{ overall_accuracy }}{% endif %}"
                 aria-valuemin="0" aria-valuemax="100">
              <span style="width: {% if readiness.goal %}{{ readiness.readiness_pct }}{% else %}{{ overall_accuracy }}{% endif %}%;"></span>
            </div>
            <div class="kid-parent__readiness-meta">
              {% if readiness_delta != None %}
                <span class="kid-parent__trend {% if readiness_delta > 0 %}is-up{% elif readiness_delta < 0 %}is-down{% endif %}">
                  {% if readiness_delta > 0 %}↑ {{ readiness_delta }}%{% elif readiness_delta < 0 %}↓ {{ readiness_delta|stringformat:"+d"|slice:"1:" }}%{% else %}No change{% endif %} this month
                </span>
              {% elif readiness.goal %}
                <span>{{ readiness.status_label }}</span>
              {% else %}
                <span>Set a target to unlock readiness tracking.</span>
              {% endif %}
              {% if readiness.goal %}<span>{{ readiness.goal.days_remaining }} days to {{ readiness.goal.target_label }}</span>{% endif %}
            </div>
          </div>
        </section>

        <div class="kid-parent__stats" aria-label="Parent progress highlights">
          <div class="kid-parent__stat">
            <span>This week</span>
            <strong>{{ parent_week.questions }} questions</strong>
            <small>{{ parent_week.time_label }} · {{ parent_week.sessions }} session{{ parent_week.sessions|pluralize }}</small>
          </div>

          <div class="kid-parent__stat">
            <span>Latest mock</span>
            {% if latest_mock and latest_mock.pct != None %}
              <strong>{{ latest_mock.pct }}%
                {% if latest_mock.delta != None and latest_mock.delta != 0 %}
                  <em class="kid-parent__mini-trend {% if latest_mock.delta > 0 %}is-up{% else %}is-down{% endif %}">
                    {% if latest_mock.delta > 0 %}↑ {{ latest_mock.delta }}%{% else %}↓ {{ latest_mock.delta|stringformat:"+d"|slice:"1:" }}%{% endif %}
                  </em>
                {% endif %}
              </strong>
              <small>Completed {{ latest_mock.date|date:"j M" }} · <a href="{% url 'practice:mock_choose' %}">Mocks</a></small>
            {% else %}
              <strong>—</strong>
              <small>No completed mock yet</small>
            {% endif %}
          </div>

          <div class="kid-parent__stat">
            <span>Strongest area</span>
            {% if strongest_section %}
              <strong>{{ strongest_section.name }}</strong>
              <small>{{ strongest_section.accuracy }}% accuracy · <button type="button" class="kid-parent__inline-link" data-open-parent-subject="{{ strongest_section.code }}">View subject →</button></small>
            {% else %}
              <strong>—</strong>
              <small>More practice needed</small>
            {% endif %}
          </div>

          <div class="kid-parent__stat kid-parent__stat--focus">
            <span>Focus area</span>
            {% if focus_section %}
              <strong>{{ focus_section.name }}</strong>
              <small>{{ focus_section.accuracy }}% accuracy · <button type="button" class="kid-parent__inline-link" data-open-parent-subject="{{ focus_section.code }}">See what to work on →</button></small>
            {% else %}
              <strong>—</strong>
              <small>More practice needed</small>
            {% endif %}
          </div>
        </div>

        <section class="kid-parent__workspace">
          <div class="kid-parent__subject-tabs" role="tablist" aria-label="Parent subject summary">
            <button type="button" class="kid-parent__subject-tab is-active" role="tab" aria-selected="true" data-parent-subject-tab="overview">Overview</button>
            {% for subject in parent_subjects %}
            <button type="button" class="kid-parent__subject-tab" role="tab" aria-selected="false" data-parent-subject-tab="{{ subject.code }}">{{ subject.name }}</button>
            {% endfor %}
          </div>

          <div class="kid-parent__subject-panel is-active" data-parent-subject-panel="overview">
            <div class="kid-parent__summary-grid">
              <div class="kid-parent__summary-copy">
                <span class="kid-parent__panel-kicker">Quick summary</span>
                {% if data.total > 0 %}
                  <h3>{{ pupil_name }} is {% if readiness.status == 'ready' %}performing strongly{% elif readiness.status == 'on_track' %}on track{% else %}building towards the target{% endif %}.</h3>
                  <p>
                    {% if strongest_section %}<strong>{{ strongest_section.name }}</strong> is currently the strongest subject at {{ strongest_section.accuracy }}%.{% endif %}
                    {% if focus_section %} The clearest priority is <strong>{{ focus_section.name }}</strong> at {{ focus_section.accuracy }}%.{% endif %}
                    {% if readiness_delta != None and readiness_delta > 0 %} Overall readiness has improved by {{ readiness_delta }} percentage point{{ readiness_delta|pluralize }} over the last month.{% endif %}
                  </p>
                {% else %}
                  <h3>There isn’t enough practice data yet.</h3>
                  <p>Once {{ pupil_name }} starts answering questions, this page will turn that activity into a simple strengths-and-priorities summary.</p>
                {% endif %}
              </div>

              <div class="kid-parent__overview-subjects">
                {% for subject in parent_subjects %}
                <button type="button" class="kid-parent__overview-row" data-open-parent-subject="{{ subject.code }}">
                  <span class="kid-parent__overview-name">
                    <span class="kid-parent__subject-dot kid-parent__subject-dot--{{ subject.key }}"></span>
                    {{ subject.name }}
                  </span>
                  <span class="kid-parent__overview-bar"><span class="kid-parent__overview-fill kid-parent__overview-fill--{{ subject.key }}" style="width: {% if subject.accuracy != None %}{{ subject.accuracy }}{% else %}0{% endif %}%;"></span></span>
                  <strong>{% if subject.accuracy != None %}{{ subject.accuracy }}%{% else %}—{% endif %}</strong>
                  <span class="kid-parent__overview-arrow">›</span>
                </button>
                {% endfor %}
              </div>
            </div>

            <div class="kid-parent__recommendation">
              <div>
                <span class="kid-parent__panel-kicker">This week’s recommendation</span>
                {% if data.weak %}
                  <strong>Prioritise {{ data.weak.0.section_name }} — {{ data.weak.0.name }}</strong>
                  <p>Aim for 3 short, focused sessions this week, while keeping the other subjects ticking over.</p>
                {% elif pending_assignments %}
                  <strong>Complete the tutor homework</strong>
                  <p>{{ homework_count }} task{{ homework_count|pluralize }} are waiting. Short, regular sessions will make them easier to finish.</p>
                {% else %}
                  <strong>Build a regular practice rhythm</strong>
                  <p>Three short sessions this week will give the dashboard enough evidence to make a more specific recommendation.</p>
                {% endif %}
              </div>
              {% if data.weak %}<a href="{% url 'practice:start' data.weak.0.id %}" class="kid-parent__recommendation-link">Start focus practice →</a>{% endif %}
            </div>
          </div>

          {% for subject in parent_subjects %}
          <div class="kid-parent__subject-panel" data-parent-subject-panel="{{ subject.code }}" hidden>
            <div class="kid-parent__subject-head">
              <div>
                <span class="kid-parent__panel-kicker">{{ subject.name }}</span>
                <h3>{% if subject.accuracy != None %}{{ subject.accuracy }}% current accuracy{% else %}Not enough data yet{% endif %}</h3>
                <p>{{ subject.attempts }} question{{ subject.attempts|pluralize }} answered in this subject.</p>
              </div>
              <a href="{% url 'practice:subject_detail' subject.code %}" class="kid-parent__subject-link">View full {{ subject.name }} progress →</a>
            </div>

            {% if subject.primary_focus %}
            <div class="kid-parent__focus-callout">
              <span>Priority</span>
              <div>
                <strong>{{ subject.primary_focus.name }}</strong>
                <p>{{ subject.primary_focus.accuracy }}% from {{ subject.primary_focus.total }} question{{ subject.primary_focus.total|pluralize }}. This is the first area to work on next.</p>
              </div>
              <a href="{% url 'practice:start' subject.primary_focus.id %}">Practise →</a>
            </div>
            {% endif %}

            <div class="kid-parent__topic-heading">
              <div>
                <h4>What to work on</h4>
                <p>Lowest-performing areas appear first.</p>
              </div>
            </div>

            <div class="kid-parent__topic-list">
              {% for topic in subject.focus_topics %}
              <a class="kid-parent__topic-row" href="{% url 'practice:start' topic.id %}">
                <div class="kid-parent__topic-main">
                  <strong>{{ topic.name }}</strong>
                  <span>{{ topic.total }} question{{ topic.total|pluralize }} answered</span>
                </div>
                <div class="kid-parent__topic-meter" aria-hidden="true"><span style="width: {{ topic.accuracy }}%;"></span></div>
                <div class="kid-parent__topic-score">{{ topic.accuracy }}%</div>
                <span class="kid-parent__topic-status kid-parent__topic-status--{{ topic.status_key }}">{{ topic.status }}</span>
                <span class="kid-parent__topic-arrow">›</span>
              </a>
              {% empty %}
              <div class="kid-parent__empty-subject">
                <strong>No topic breakdown yet.</strong>
                <span>Once {{ pupil_name }} has answered a few {{ subject.name }} questions, the areas to focus on will appear here.</span>
                <a href="{% url 'practice:subject_detail' subject.code %}">Open {{ subject.name }} →</a>
              </div>
              {% endfor %}
            </div>
          </div>
          {% endfor %}
        </section>

      </div>
    </div>

  </div>
</div>

<script>
  (() => {
    const root = document.querySelector('.kid-dash');
    if (!root || root.dataset.tabsReady === '1') return;
    root.dataset.tabsReady = '1';

    const tabs = Array.from(root.querySelectorAll('[data-dashboard-tab]'));
    const views = Array.from(root.querySelectorAll('[data-dashboard-view]'));

    function activate(name, updateHash = true) {
      tabs.forEach((tab) => {
        const active = tab.dataset.dashboardTab === name;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      views.forEach((view) => {
        view.hidden = view.dataset.dashboardView !== name;
      });

      if (updateHash) {
        const hash = name === 'parent' ? '#parent-summary' : '#student-dashboard';
        if (history.replaceState) history.replaceState(null, '', hash);
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => activate(tab.dataset.dashboardTab));
    });

    const subjectTabs = Array.from(root.querySelectorAll('[data-parent-subject-tab]'));
    const subjectPanels = Array.from(root.querySelectorAll('[data-parent-subject-panel]'));

    function activateParentSubject(name) {
      subjectTabs.forEach((tab) => {
        const active = tab.dataset.parentSubjectTab === name;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      subjectPanels.forEach((panel) => {
        const active = panel.dataset.parentSubjectPanel === name;
        panel.classList.toggle('is-active', active);
        panel.hidden = !active;
      });
    }

    subjectTabs.forEach((tab) => {
      tab.addEventListener('click', () => activateParentSubject(tab.dataset.parentSubjectTab));
    });

    root.querySelectorAll('[data-open-parent-subject]').forEach((control) => {
      control.addEventListener('click', () => {
        activateParentSubject(control.dataset.openParentSubject);
        root.querySelector('.kid-parent__workspace')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    activateParentSubject('overview');
    activate(location.hash === '#parent-summary' ? 'parent' : 'student', false);
  })();
</script>
{% endblock %}
