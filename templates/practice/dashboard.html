{% extends "base.html" %}
{% load account %}
{% load static %}
{% block title %}Dashboard — RevisorPlus{% endblock %}

{% block extra_head %}
{# This page's stylesheet was 925 lines of inline <style> in this block. #}
<link rel="stylesheet" href="{% static 'student_portals/dashboard.css' %}?v=11">
{% endblock %}

{% comment %}
Full-bleed: .kid-dash paints the page's grey canvas, so it runs edge to edge and
.kid-dash__shell inside it measures the content off base.html's --measure and
--gutter. Taking <main>'s own measure as well would inset the canvas and double
the gutter.
{% endcomment %}
{% block main_class %}rp-bleed py-4{% endblock %}

{% block main %}
<div class="kid-dash">
  {% user_display user as pupil_name %}
  <div class="kid-dash__shell">

    {% comment %}
      One header above the tabs, in base.html's shared .rp-page-head. There
      were two before, one per tab: .kid-dash__hello here (hidden while the
      student tab was up) and .kid-dash__head inside the student view, which
      put this page's h1 below the tab bar while every other page's sat
      directly under the nav. The exam chip stays where it was, in the
      header's right-hand slot.
    {% endcomment %}
    <div class="rp-page-head">
      <div class="rp-page-head__text">
        <span class="rp-page-head__kicker">Dashboard</span>
        <h1 class="rp-page-head__title">Welcome back, {{ pupil_name }}</h1>
        <p class="rp-page-head__lead">
          {% if coverage %}
            {{ coverage.seen }} of {{ coverage.bank }} questions attempted.
          {% endif %}
          Ready to make a little more progress today?
        </p>
      </div>
      {% if readiness.goal %}
      <div class="rp-page-head__aside">
        <div class="kid-dash__examchip">
          <div class="kid-dash__examchip-strong">{{ readiness.goal.target_label }}</div>
          <div>{{ readiness.goal.exam_date|date:"D j M" }}</div>
          <div>{{ readiness.goal.days_remaining }} day{{ readiness.goal.days_remaining|pluralize }} to go</div>
        </div>
      </div>
      {% else %}
      <div class="rp-page-head__aside">
        <div class="kid-dash__examchip">
          <div class="kid-dash__examchip-strong">No target set</div>
          <div><a href="{% url 'goals:setup' %}">Set one</a></div>
        </div>
      </div>
      {% endif %}
    </div>

    <div class="kid-dash__view" id="student-view">

      {% comment %}
        Structure follows docs/dashboard-redesign.html element for element:
        Subjects panel, Resume panel, then Today and Mock papers side by side
        in .cols. The head it opened with — h1, subline and exam chip — is now
        the shared page header above the tabs.
      {% endcomment %}
      <div class="kid-dash__panel">
        <div class="kid-dash__panelhead">
          <h2>Subjects</h2>
          <a class="kid-dash__hint" href="{% url 'practice:choose' %}">Go to Study &rsaquo;</a>
        </div>
        <p class="kid-dash__panelsub">Accuracy over the last 30 days.</p>

        {% comment %}
          Coloured from band_level, never from the band label: the wording is
          still open (the parent side says Secure / Developing / Needs work) and
          changing a string should not change which row is coloured. The row's
          subject tint is a second modifier off the same s.key the chip and the
          bar fill use, so a subject is one colour across all three.
        {% endcomment %}
        {% for s in subjects %}
        <a class="kid-dash__srow kid-dash__srow--{{ s.key }}" href="{% url 'practice:subject_detail' s.code %}">
          <span class="kid-dash__chip kid-dash__chip--{{ s.key }}" aria-hidden="true">{{ s.chip }}</span>
          <span class="kid-dash__sname">{{ s.name }}</span>
          <span class="kid-dash__track" role="progressbar"
                aria-valuenow="{{ s.pct_complete }}" aria-valuemin="0" aria-valuemax="100"
                aria-label="{{ s.name }}: {{ s.completed }} of {{ s.total }} questions attempted">
            <span class="kid-dash__fill kid-dash__fill--{{ s.key }}" style="width: {{ s.pct_complete }}%;"></span>
          </span>
          <span class="kid-dash__count">{{ s.completed }} of {{ s.total }} attempted</span>
          {% if s.band_level == "good" %}
            <span class="kid-dash__verdict kid-dash__verdict--good">{{ s.band }}</span>
          {% elif s.band_level == "mid" %}
            <span class="kid-dash__verdict kid-dash__verdict--mid">{{ s.band }}</span>
          {% elif s.band_level == "low" %}
            <span class="kid-dash__verdict kid-dash__verdict--low">{{ s.band }}</span>
          {% else %}
            <span class="kid-dash__verdict kid-dash__verdict--none">Not enough yet</span>
          {% endif %}
          <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
        </a>
        {% endfor %}
      </div>

      {% if resume %}
      <div class="kid-dash__panel kid-dash__panel--resume">
        <div class="kid-dash__resumeline">
          <div>
            <div class="kid-dash__resume-t">{{ resume.name }}</div>
            <div class="kid-dash__resume-m">
              {{ resume.section }}{% if resume.total %}, {{ resume.done }} of {{ resume.total }} answered{% endif %}
            </div>
          </div>
          <a class="kid-dash__btn" href="{% url 'practice:resume' resume.id %}">Resume</a>
        </div>
      </div>
      {% endif %}

      <div class="kid-dash__cols">
        <div class="kid-dash__panel kid-dash__panel--plain">
          <h2>Today</h2>
          <p class="kid-dash__panelsub">Start at the top. You don’t have to do all of it.</p>

          {% now "Y-m-d" as today %}
          {% for a in pending_assignments|slice:":3" %}
          <a class="kid-dash__trow" href="{% url 'practice:start' a.subtopic.id %}">
            <span class="kid-dash__trow-main">
              <span class="kid-dash__tname">
                {{ a.subtopic.name }}
                {% if a.due_date|date:"Y-m-d" < today %}<span class="kid-dash__late">Late</span>{% endif %}
              </span>
              <span class="kid-dash__tmeta">Set by your tutor, {{ a.target_count }} question{{ a.target_count|pluralize }}</span>
            </span>
            <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
          </a>
          {% endfor %}

          {% if premium %}
            {% for topic in suggested_topics|slice:":3" %}
            <a class="kid-dash__trow" href="{% url 'practice:start' topic.id %}">
              <span class="kid-dash__trow-main">
                <span class="kid-dash__tname">{{ topic.name }}</span>
                <span class="kid-dash__tmeta">Worth some practice</span>
              </span>
              <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
            </a>
            {% endfor %}
            {% if not pending_assignments and not suggested_topics %}
            <p class="kid-dash__empty">
              Nothing set for today.
              <a href="{% url 'practice:choose' %}">Pick a subject</a> and this list will fill in as you practise.
            </p>
            {% endif %}
          {% else %}
          {# Locked: focus areas are Premium (billing/entitlements.is_premium).
             Always rendered for a non-premium pupil, under any homework rows —
             no link, since pupils never see a payment surface. #}
          <div class="kid-dash__trow" data-rp-locked>
            <span class="kid-dash__trow-main">
              <span class="kid-dash__tname">Focus areas are part of Premium</span>
              <span class="kid-dash__tmeta">Ask your parent.</span>
            </span>
          </div>
          {% endif %}
        </div>

        <div class="kid-dash__panel kid-dash__panel--plain">
          <h2>Mock papers</h2>
          <p class="kid-dash__panelsub">Sat under timed conditions, one paper at a sitting.</p>
          {% for p in mock_papers %}
          <a class="kid-dash__trow" href="{% url 'practice:mock_choose' %}">
            <span class="kid-dash__trow-main">
              <span class="kid-dash__tname">{{ p.section.name }}</span>
              <span class="kid-dash__tmeta">
                {% if p.sat_on %}Sat {{ p.sat_on|date:"j M" }}{% else %}Not sat yet{% endif %}
              </span>
            </span>
            <span class="kid-dash__go" aria-hidden="true">&rsaquo;</span>
          </a>
          {% endfor %}
        </div>
      </div>

    </div>


  </div>
</div>

{% endblock %}
