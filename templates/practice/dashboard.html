{% extends "base.html" %}
{% load account %}
{% load static %}
{% block title %}Dashboard — RevisorPlus{% endblock %}

{% block extra_head %}
{# This page's stylesheet was 925 lines of inline <style> in this block. #}
<link rel="stylesheet" href="{% static 'student_portals/dashboard.css' %}?v=2">
{% endblock %}

{% block main %}
<div class="kid-dash" data-active-tab="student">
  {% user_display user as pupil_name %}
  <div class="kid-dash__shell">

    <div class="kid-dash__hello">
      <div>
        <h1>Hi {{ pupil_name }} 👋</h1>
        <p>Ready to make a little more progress today?</p>
      </div>
    </div>

    <div class="kid-dash__tabs" role="tablist" aria-label="Dashboard view">
      <button type="button" class="kid-dash__tab is-active" id="student-tab" role="tab" aria-selected="true" aria-controls="student-view" data-dashboard-tab="student">
        Student dashboard
      </button>
      <button type="button" class="kid-dash__tab" id="parent-tab" role="tab" aria-selected="false" aria-controls="parent-view" data-dashboard-tab="parent">
        Parent summary
      </button>
    </div>

    <div class="kid-dash__view" id="student-view" role="tabpanel" aria-labelledby="student-tab" data-dashboard-view="student">

      {% comment %}
        The greeting, at the mockup's size and without the "Ready to make a
        little more progress today?" line. .kid-dash__hello above the tabs is
        untouched — it is the parent tab's header, and CSS hides it while the
        student tab is the one showing, so the greeting never appears twice.
      {% endcomment %}
      <header class="kid-dash__head">
        <h1 class="kid-dash__title">Hi {{ pupil_name }}</h1>
        <p class="kid-dash__standfirst">
          {% if readiness.goal %}
            <b>{{ readiness.goal.days_remaining }} day{{ readiness.goal.days_remaining|pluralize }}</b>
            until your {{ readiness.goal.target_label }} exam.
          {% else %}
            <a href="{% url 'goals:setup' %}">Set a target</a> to see how long you have.
          {% endif %}
        </p>
      </header>

      {% if paused %}
      <a class="kid-dash__resume" href="{% url 'practice:resume' paused.0.id %}">
        <span class="kid-dash__resume-k">Carry on where you stopped</span>
        <span class="kid-dash__resume-v">{{ paused.0.subtopic.name }}</span>
      </a>
      {% endif %}

      <section class="kid-dash__section">
        <h2 class="kid-dash__section-title">Today</h2>
        <p class="kid-dash__section-sub">Start at the top. You don’t have to do all of it.</p>

        {% if pending_assignments or suggested_topics %}
        <div class="kid-dash__rows">
          {# Homework first: it has a deadline and somebody else is waiting on it. #}
          {% now "Y-m-d" as today %}
          {% for a in pending_assignments|slice:":3" %}
          <a class="kid-dash__row" href="{% url 'practice:start' a.subtopic.id %}">
            <span class="kid-dash__row-main">
              <span class="kid-dash__row-name">
                {{ a.subtopic.name }}
                {% if a.due_date|date:"Y-m-d" < today %}<span class="kid-dash__flag">Late</span>{% endif %}
              </span>
              <span class="kid-dash__row-meta">Set by your tutor, {{ a.target_count }} question{{ a.target_count|pluralize }}</span>
            </span>
            <span class="kid-dash__row-go" aria-hidden="true">›</span>
          </a>
          {% endfor %}

          {% for topic in suggested_topics|slice:":3" %}
          <a class="kid-dash__row" href="{% url 'practice:start' topic.id %}">
            <span class="kid-dash__row-main">
              <span class="kid-dash__row-name">{{ topic.name }}</span>
              <span class="kid-dash__row-meta">Worth some practice</span>
            </span>
            <span class="kid-dash__row-go" aria-hidden="true">›</span>
          </a>
          {% endfor %}
        </div>
        {% else %}
        <p class="kid-dash__empty">
          Nothing set for today.
          <a href="{% url 'practice:choose' %}">Pick a subject</a> and this list will fill in as you practise.
        </p>
        {% endif %}
      </section>

      <section class="kid-dash__section">
        <h2 class="kid-dash__section-title">Your subjects</h2>
        <p class="kid-dash__section-sub">How you’ve been doing over the last month.</p>

        {% comment %}
          Switched on band_level, never on the band label: the pupil-facing
          wording is still open (the parent side says Secure / Developing /
          Needs work) and changing a string should not silently change which
          row is coloured. `subjects` is written out here rather than through
          practice/_subject_card.html, because that partial is also included by
          practice/choose.html, which shows the same subjects without a band.
        {% endcomment %}
        <div class="kid-dash__rows">
          {% for s in subjects %}
          <a class="kid-dash__row{% if not s.band_level %} kid-dash__row--muted{% endif %}"
             href="{% url 'practice:subject_detail' s.code %}">
            <span class="kid-dash__chip kid-dash__chip--{{ s.code|lower }}" aria-hidden="true">{{ s.code }}</span>
            <span class="kid-dash__row-main">
              <span class="kid-dash__row-name">{{ s.name }}</span>
            </span>
            <span class="kid-dash__track" role="progressbar"
                  aria-valuenow="{{ s.pct_complete }}" aria-valuemin="0" aria-valuemax="100"
                  aria-label="{{ s.name }}: {{ s.completed }} of {{ s.total }} questions attempted">
              <span class="kid-dash__fill" style="width: {{ s.pct_complete }}%;"></span>
            </span>
            <span class="kid-dash__count">{{ s.completed }} of {{ s.total }} attempted</span>
            {% if s.band_level == "good" %}
              <span class="kid-dash__band kid-dash__band--good">{{ s.band }}</span>
            {% elif s.band_level == "mid" %}
              <span class="kid-dash__band kid-dash__band--mid">{{ s.band }}</span>
            {% elif s.band_level == "low" %}
              <span class="kid-dash__band kid-dash__band--low">{{ s.band }}</span>
            {% else %}
              <span class="kid-dash__band kid-dash__band--none">Not started</span>
            {% endif %}
            <span class="kid-dash__row-go" aria-hidden="true">›</span>
          </a>
          {% endfor %}
        </div>
      </section>

    </div>

    <div class="kid-dash__view" id="parent-view" role="tabpanel" aria-labelledby="parent-tab" data-dashboard-view="parent" hidden>
      <div class="kid-parent">

        <section class="kid-dash__card kid-parent__intro">
          <div class="kid-parent__intro-copy">
            <span class="kid-dash__section-kicker">Parent summary</span>
            {% if data.total > 0 %}
            <h2>{{ pupil_name }} is making steady progress.</h2>
            {% else %}
            <h2>{{ pupil_name }} hasn’t started practising yet.</h2>
            {% endif %}
            <p>A simple weekly snapshot of progress, priorities and homework.</p>
          </div>
          <div class="kid-parent__target">
            <span>Target school</span>
            {% if readiness.goal %}
            <strong>{{ readiness.goal.target_label }}</strong>
            <span>{{ readiness.goal.days_remaining }} days to go</span>
            {% else %}
            <strong>No target set</strong>
            <span>—</span>
            {% endif %}
          </div>
        </section>

        <div class="kid-parent__stats">
          <div class="kid-parent__stat">
            <span>Target progress</span>
            <strong>{% if readiness.goal %}{{ readiness.readiness_pct }}%{% else %}—{% endif %}</strong>
          </div>
          <div class="kid-parent__stat">
            <span>Overall accuracy</span>
            <strong>{{ overall_accuracy }}%</strong>
          </div>
          <div class="kid-parent__stat">
            <span>Questions done</span>
            <strong>{{ questions_done }}</strong>
          </div>
          <div class="kid-parent__stat">
            <span>Homework left</span>
            <strong>{{ homework_count }}</strong>
          </div>
        </div>

        <div class="kid-parent__grid">
          <section class="kid-dash__card kid-parent__panel">
            <h3>What you need to know</h3>
            <p>The main things to take away from this week.</p>

            <div class="kid-parent__simple-list">
              <div class="kid-parent__simple-row">
                <span>Doing well</span>
                {% if strongest_section %}
                <strong>{{ strongest_section.name }} is currently the strongest paper, at {{ strongest_section.accuracy }}%.</strong>
                {% else %}
                <strong>Not enough practice yet to show a strongest subject.</strong>
                {% endif %}
              </div>
              <div class="kid-parent__simple-row">
                <span>Needs focus</span>
                {% if data.weak %}
                <strong>{{ data.weak.0.section_name }} {{ data.weak.0.name }}{% if data.weak.1 %} and {{ data.weak.1.section_name }} {{ data.weak.1.name }}{% endif %} {% if data.weak.1 %}are the best areas{% else %}is the best area{% endif %} to work on next.</strong>
                {% else %}
                <strong>No clear weak spots yet — keep practising to build up a picture.</strong>
                {% endif %}
              </div>
              <div class="kid-parent__simple-row">
                <span>Homework</span>
                {% if pending_assignments %}
                <strong>{{ homework_count }} tutor task{{ homework_count|pluralize }} waiting to be completed.</strong>
                {% else %}
                <strong>No homework currently assigned.</strong>
                {% endif %}
              </div>
              <div class="kid-parent__simple-row">
                <span>This week</span>
                <strong>Keep sessions short and regular rather than doing one long revision session.</strong>
              </div>
            </div>
          </section>

          <section class="kid-dash__card kid-parent__panel">
            <h3>Subject snapshot</h3>
            <p>A simple view of current performance.</p>

            <div class="kid-parent__subjects">
              <div class="kid-parent__subject">
                <div class="kid-parent__subject-name">English</div>
                {% with sec=section_by_code.ENG %}
                <div class="kid-dash__bar" role="progressbar" aria-valuenow="{% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}" aria-valuemin="0" aria-valuemax="100" aria-label="English progress: {% if sec.total %}{{ sec.accuracy }}%{% else %}not enough data yet{% endif %}"><span style="width: {% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}%;"></span></div>
                <div class="kid-parent__subject-score">{% if sec.total %}{{ sec.accuracy }}%{% else %}—{% endif %}</div>
                {% endwith %}
              </div>
              <div class="kid-parent__subject">
                <div class="kid-parent__subject-name">Maths</div>
                {% with sec=section_by_code.MAT %}
                <div class="kid-dash__bar" role="progressbar" aria-valuenow="{% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}" aria-valuemin="0" aria-valuemax="100" aria-label="Maths progress: {% if sec.total %}{{ sec.accuracy }}%{% else %}not enough data yet{% endif %}"><span style="width: {% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}%;"></span></div>
                <div class="kid-parent__subject-score">{% if sec.total %}{{ sec.accuracy }}%{% else %}—{% endif %}</div>
                {% endwith %}
              </div>
              <div class="kid-parent__subject">
                <div class="kid-parent__subject-name">Verbal</div>
                {% with sec=section_by_code.VR %}
                <div class="kid-dash__bar" role="progressbar" aria-valuenow="{% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}" aria-valuemin="0" aria-valuemax="100" aria-label="Verbal progress: {% if sec.total %}{{ sec.accuracy }}%{% else %}not enough data yet{% endif %}"><span style="width: {% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}%;"></span></div>
                <div class="kid-parent__subject-score">{% if sec.total %}{{ sec.accuracy }}%{% else %}—{% endif %}</div>
                {% endwith %}
              </div>
              <div class="kid-parent__subject">
                <div class="kid-parent__subject-name">Non-Verbal</div>
                {% with sec=section_by_code.NVR %}
                <div class="kid-dash__bar" role="progressbar" aria-valuenow="{% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}" aria-valuemin="0" aria-valuemax="100" aria-label="Non-Verbal progress: {% if sec.total %}{{ sec.accuracy }}%{% else %}not enough data yet{% endif %}"><span style="width: {% if sec.total %}{{ sec.accuracy }}{% else %}0{% endif %}%;"></span></div>
                <div class="kid-parent__subject-score">{% if sec.total %}{{ sec.accuracy }}%{% else %}—{% endif %}</div>
                {% endwith %}
              </div>
            </div>
          </section>
        </div>

        <div class="kid-parent__action">
          <div>
            <strong>Best thing to do this week</strong>
            <span>
              {% if data.weak %}
              Short daily practice, with extra attention on {{ data.weak.0.name }}{% if data.weak.1 %} and {{ data.weak.1.name }}{% endif %}{% if pending_assignments %}, plus the tutor homework{% endif %}.
              {% elif pending_assignments %}
              Short daily practice, plus the tutor homework that’s waiting.
              {% else %}
              Short, regular practice sessions — a clear picture of strengths and weaknesses will build up from here.
              {% endif %}
            </span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  (() => {
    const root = document.querySelector('.kid-dash');
    if (!root || root.dataset.tabsReady === '1') return;
    root.dataset.tabsReady = '1';

    const tabs = Array.from(root.querySelectorAll('[data-dashboard-tab]'));
    const views = Array.from(root.querySelectorAll('[data-dashboard-view]'));

    function activate(name, updateHash = true) {
      tabs.forEach((tab) => {
        const active = tab.dataset.dashboardTab === name;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      views.forEach((view) => {
        view.hidden = view.dataset.dashboardView !== name;
      });

      // Which header to show: the student view carries its own <h1>, so
      // .kid-dash__hello is hidden by CSS while that tab is up.
      root.dataset.activeTab = name;

      if (updateHash) {
        const hash = name === 'parent' ? '#parent-summary' : '#student-dashboard';
        if (history.replaceState) history.replaceState(null, '', hash);
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => activate(tab.dataset.dashboardTab));
    });

    activate(location.hash === '#parent-summary' ? 'parent' : 'student', false);
  })();
</script>
{% endblock %}
