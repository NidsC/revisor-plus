name: Validate question packs

# Runs the authoring-contract checker on every PR that touches the question data.
# A pack that fails validate_questions.py fails this job. Make it a *required* status
# check in the branch-protection settings for `main` so a failing pack cannot merge.
on:
  pull_request:
    paths:
      - "elevenplus_data/**"
      - "catalog/**"
      # Every test this workflow runs has to be listed, or a PR that changes only
      # the test does not run it. test_validator.py and build.sh were both missing:
      # build.sh is what the `pipeline` job exists to rehearse, so a change to the
      # deploy could not be checked by the job that models it.
      - "test_kinds.py"
      - "test_validator.py"
      - "test_import_safety.py"
      - "test_misconceptions.py"
      - "test_figures.py"
      - "test_nvr_page.py"
      - "build.sh"
      - "templates/**"
      - ".github/workflows/validate-questions.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The glob deliberately includes the _EXAMPLE packs as well as the template and
      # every contributor pack. The examples are the worked demonstration of the seven
      # answer kinds and of a shared passage — they are what an author is told to copy,
      # so an example that has drifted out of contract teaches the drift to everyone
      # who follows it. They were outside this glob and therefore unchecked.
      #
      # Passing every pack in one invocation also matters: the cross-pack checks
      # (duplicate `source`, a `ref` claimed by two packs, colliding stems) only run
      # when the validator is given more than one file. A reused `source` is the one
      # authoring mistake that destroys another author's questions on import, and it
      # is invisible when packs are validated one at a time.
      - name: Validate the template, the examples and every contributor pack
        run: |
          shopt -s nullglob
          packs=(
            elevenplus_data/_TEMPLATE.question_pack.json
            elevenplus_data/_EXAMPLE.*.json
            elevenplus_data/contrib_*.json
          )
          echo "Validating: ${packs[*]}"
          python3 elevenplus_data/validate_questions.py "${packs[@]}"

      # The authoring tools are stdlib-only and are run by contributors who cannot be
      # asked to debug a traceback. A syntax error in either is a broken session, so
      # check they at least import and answer --help.
      - name: Smoke-test the authoring tools
        run: |
          python3 -c "import ast; ast.parse(open('elevenplus_data/preview_questions.py').read())"
          python3 elevenplus_data/taxonomy_lookup.py --sections
          python3 elevenplus_data/taxonomy_lookup.py MAT > /dev/null
          python3 elevenplus_data/preview_figures.py /tmp/figures.html

      # Every figure must render at one CSS pixel per user unit, draw no chrome
      # text, stay inside its own measured box, and keep one panel size across
      # every kind. Before the figures package each kind picked its own viewBox
      # AND its own max-width, and the two were unrelated — a five-net figure
      # rendered its labels at 7.5px on a phone beside a four-panel figure
      # rendering at 13px. No database needed: catalog/figures is stdlib-only,
      # which is also what lets the contributor preview share it.
      - name: Figures obey the size contract
        run: |
          python3 test_figures.py | tee /tmp/figures.log
          grep -q "RESULT: ALL PASSED" /tmp/figures.log

      # The step above proves a pack conforms question by question. It cannot prove
      # anything about the pack as a WHOLE — "more than half your answers are option
      # A" is not a defect any single question has, which is why a run of 25 got
      # written and nothing objected. Those whole-pack rules are checked here instead,
      # against packs built in memory, because the defect cannot be demonstrated by a
      # file that is also the thing authors are told to copy.
      - name: Check the whole-pack validator rules
        run: python3 test_validator.py

  # A pack conforming to the contract is necessary but not sufficient: a kind is only
  # usable when the model stores it, the validator admits it, the importer carries its
  # fields and the marking engine scores it. Those four have disagreed silently before
  # — `extended_text` sat supported in the model and the marking engine for months
  # while the validator refused it. test_kinds.py checks all four for all eight kinds,
  # and nothing ran it.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      # seed_demo first: test_kinds.py logs in as a seeded pupil to exercise the real
      # view, and without one it fails on an AttributeError that says nothing about
      # the cause.
      - name: Build a database and import the examples
        run: |
          python manage.py migrate
          python manage.py sync_taxonomy
          python manage.py seed_demo
          python manage.py import_pack elevenplus_data/_EXAMPLE.answer_kinds.json
          python manage.py import_pack elevenplus_data/_EXAMPLE.shared_passage.json
          python manage.py import_pack elevenplus_data/_EXAMPLE.vr_shapes.json
          python manage.py import_pack elevenplus_data/_EXAMPLE.nvr_figures.json

      # The `validate` job checks contributor packs against the CONTRACT: it reads
      # JSON and never touches Django. `import_pack` does strictly more than that —
      # it resolves every subtopic and question_type against the taxonomy IN THE
      # DATABASE, builds passage containers, and writes AnswerOption rows. So a pack
      # can pass the validator and still fail the import, and until this step existed
      # the first thing to discover that was the production build: build.sh imports
      # every contrib_*.json on deploy, and the loop had never once run with real
      # content because the repo had no contributor pack until 2026-08-26.
      #
      # nullglob so this is a no-op when there are none, matching build.sh.
      - name: Import every contributor pack, as the deploy does
        run: |
          shopt -s nullglob
          for pack in elevenplus_data/contrib_*.json; do
            echo "Importing question pack: $pack"
            python manage.py import_pack "$pack"
          done

      - name: Every answer kind survives the whole pipeline
        run: |
          python manage.py shell < test_kinds.py | tee /tmp/kinds.log
          grep -q "RESULT: ALL PASSED" /tmp/kinds.log

      # `manage.py shell` exits 0 whatever the script prints, so the grep is what
      # actually fails the job — same pattern as the step above.
      - name: A failed import cannot destroy the questions it was replacing
        run: |
          python manage.py shell < test_import_safety.py | tee /tmp/import_safety.log
          grep -q "RESULT: ALL PASSED" /tmp/import_safety.log

      # Four components have to agree for one field: the validator admits it, the
      # importer carries it, the model stores it and the marking engine reads it
      # back. That is the same shape of disagreement test_kinds.py exists for.
      - name: A pack-authored misconception reaches the pupil
        run: |
          python manage.py shell < test_misconceptions.py | tee /tmp/misconceptions.log
          grep -q "RESULT: ALL PASSED" /tmp/misconceptions.log

      # The gap between "the figure draws correctly" (test_figures.py, no
      # database) and "a pupil can see and answer it". Needs generated content
      # as well as the example pack, because authored and generated questions
      # reach the page through different importers.
      #
      # Last in the job on purpose: it runs generate_bank, which writes several
      # thousand questions, and every step above reads a bank this one would
      # otherwise have changed underneath them.
      - name: A non-verbal question reaches the page as pictures
        run: |
          python manage.py generate_bank --per-module 60 --seed 11
          python manage.py shell < test_nvr_page.py | tee /tmp/nvr.log
          grep -q "RESULT: ALL PASSED" /tmp/nvr.log
