# Render Blueprint for RevisorPlus.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
#
# The service name sets the hostname (revisorplus.onrender.com) and cannot be
# changed later without changing the URL, so it must not collide with the
# MedRevisor service — that is a separate product on the same account.
#
# NO DATABASE BLOCK, DELIBERATELY.
# Render's free tier allows one Postgres per account and MedRevisor already
# holds it; declaring a second one fails the whole blueprint apply. With no
# DATABASE_URL set, config/settings.py falls back to SQLite on the instance
# disk, which build.sh populates via migrate + seed_demo on every deploy.
#
# What that costs: the database is rebuilt from scratch each deploy, so any
# account or attempt created during a demo does not survive one. That is
# acceptable while the bank is seed content and the DB is disposable by
# design — but it is NOT acceptable once questions can be authored through
# the admin, because then the database is the only copy of that content.
#
# To move to Postgres later, restore the two blocks marked below and either
# free the MedRevisor free-tier slot or pay for a second instance:
#
#   databases:
#     - name: revisorplus-db
#       plan: free
#
#   ...and under the service's envVars:
#     - key: DATABASE_URL
#       fromDatabase:
#         name: revisorplus-db
#         property: connectionString

services:
  - type: web
    name: revisorplus
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Kept low on purpose: SQLite serialises writes behind a file lock, so
      # several workers racing to record attempts produce "database is locked".
      # Two is plenty for a demo. Raise this when moving to Postgres.
      - key: WEB_CONCURRENCY
        value: "2"
