# Render Blueprint for RevisorPlus.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
#
# The service name sets the hostname (revisorplus.onrender.com) and cannot be
# changed later without changing the URL, so it must not collide with the
# MedRevisor service — that is a separate product on the same account.
#
# NO DATABASE BLOCK, BUT THERE *IS* A DATABASE.
# Postgres `revisorplus-db` was created through the Render dashboard on
# 2026-08-25 and is live. It is deliberately not declared here: it was created
# outside the blueprint, and whether an apply would adopt the existing instance
# or try to create a second one and fail is unverified. Adding a `databases:`
# block is a change to make and test on purpose, not a tidy-up.
#
# DATABASE_URL reaches the service from a dashboard environment group, not from
# this file. That is stable — Render preserves environment variables a blueprint
# does not declare, and this file does not declare it. The corollary is that
# nothing in this repo records which database the app uses; the service's
# Environment tab is the only source of truth.
#
# Why that matters more than it looks: config/settings.py reads DATABASE_URL and
# nothing else (dj_database_url defaults to that exact variable name). If it ever
# goes missing, or an environment group supplies the connection string under a
# different key, Django falls back to SQLite on the instance disk with no error
# at all — a green deploy, a working site, and every account and attempt silently
# discarded on the next deploy or 15-minute idle spin-down. build.sh prints which
# database it connected to, before it does any work, for exactly this reason.
#
# If revisorplus-db is on the free instance type, note that free Postgres expires
# 30 days after creation and Render keeps no backups and offers no recovery for
# it. In that case ./backup.sh, run against the External Database URL, is the
# only copy of the data that exists.
#
# To bring the database under blueprint control later, restore both blocks and
# test the apply deliberately:
#
#   databases:
#     - name: revisorplus-db
#       plan: free
#
#   ...and under the service's envVars:
#     - key: DATABASE_URL
#       fromDatabase:
#         name: revisorplus-db
#         property: connectionString

services:
  - type: web
    name: revisorplus
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Two workers on a 0.1 CPU / 512 MB free instance. The original reason for
      # keeping this low was SQLite serialising writes behind a file lock, which
      # went away with Postgres on 2026-08-25 — but the instance size quietly
      # replaced it as the binding constraint. Four sync workers on a tenth of a
      # core contend rather than help, and 512 MB split four ways is tight for a
      # Django process with allauth and Stripe loaded. Raise this together with
      # the instance size, not on its own; for I/O-bound concurrency without four
      # interpreters, --worker-class gthread --threads N is the cheaper lever.
      - key: WEB_CONCURRENCY
        value: "2"
