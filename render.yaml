# Render Blueprint for Med-revisor.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
databases:
  - name: medrevisor-db
    plan: free

services:
  - type: web
    name: medrevisor
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medrevisor-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_CONCURRENCY
        value: "4"
